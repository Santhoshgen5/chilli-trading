<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1236" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      This route is its own document. Its title, description, canonical and Open
      Graph tags are static here rather than written at runtime, and the page
      body is prerendered into #root by scripts/prerender.mjs — so nothing on
      this page depends on JavaScript having run.
    -->
    <title>Export Destinations — Where We Supply | MAVEH WORLD</title>
    <meta name="description" content="Export destinations MAVEH WORLD is set up to supply, across the Middle East, South-East Asia, East Asia, South Asia, North America and Europe. Contact us for other destinations." />
    <link rel="canonical" href="https://www.mavehworld.com/markets" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MAVEH WORLD" />
    <meta property="og:url" content="https://www.mavehworld.com/markets" />
    <meta property="og:title" content="Export Destinations — Where We Supply | MAVEH WORLD" />
    <meta property="og:description" content="Destinations we are set up to supply, across six regions. Contact us for other destinations." />
    <!-- TODO: replace with a 1200x630 PNG once real product photography exists. -->
    <meta property="og:image" content="https://www.mavehworld.com/og-default.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Scroll reveals start hidden. That start state is applied here, not in the
      prerendered markup, so this page is readable without JS. Reduced motion
      opts out entirely, and the timeout drops the start state if the bundle
      never arrives rather than leaving content invisible.
    -->
    <script>
      ;(function () {
        try {
          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return
          var el = document.documentElement
          el.classList.add('js-reveal')
          setTimeout(function () {
            if (!el.classList.contains('hydrated')) el.classList.remove('js-reveal')
          }, 4000)
        } catch (e) {}
      })()
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Home",
            "item": "https://www.mavehworld.com/"
          },
          {
            "@type": "ListItem",
            "position": 2,
            "name": "Export destinations",
            "item": "https://www.mavehworld.com/markets"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entries/markets.tsx"></script>
  </body>
</html>
