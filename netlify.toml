[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: every route serves the built index.html so client-side
# routing (react-router) works on a static host.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache the fingerprinted assets Vite emits.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
