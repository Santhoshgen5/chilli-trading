[build]
  command = "npm run build"
  publish = "dist"

# No SPA fallback. This is a multi-page site: every route is its own prebuilt
# HTML document, and Netlify serves `products.html` at `/products` on its own.
# A catch-all rewrite to index.html would hand every URL the homepage.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Image derivatives are content-stable and referenced by fixed filenames, so
# they are cached hard but revalidated — regenerating art must not be invisible
# to anyone holding an old copy.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
