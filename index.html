<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F1A4A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Base metadata. Per-page <title>/<meta> are set at runtime via react-helmet-async. -->
    <title>MAVEH WORLD — Dry Red Chilli Exporter | Teja, Byadgi, Sannam S4</title>
    <meta
      name="description"
      content="Indian exporter of dry red chilli — Teja, Byadgi and Sannam S4. Specified per lot: SHU, moisture below 12%, foreign matter under 1%. Minimum order 1 MT. Request a quote."
    />
    <link rel="canonical" href="https://www.mavehworld.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MAVEH WORLD" />
    <meta property="og:title" content="MAVEH WORLD — Dry Red Chilli Exporter" />
    <meta
      property="og:description"
      content="Teja, Byadgi and Sannam S4 dry red chilli, specified per lot. Minimum order 1 MT. Export enquiries welcome."
    />
    <meta property="og:url" content="https://www.mavehworld.com/" />
    <!-- Placeholder OG image (branded SVG). Replace with a 1200x630 PNG/JPG for
         maximum social-preview compatibility — see README. -->
    <meta property="og:image" content="https://www.mavehworld.com/og-default.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- JSON-LD: Organization. Static so crawlers see it without executing JS. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "MAVEH WORLD",
        "description": "Indian exporter of dry red chilli — Teja, Byadgi and Sannam S4.",
        "url": "https://www.mavehworld.com/",
        "email": "worldofmaveh@gmail.com",
        "telephone": "+91-6380463348",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "No. 7, Seda Street, Orathanadu (Taluk & Post)",
          "addressLocality": "Thanjavur District",
          "addressRegion": "Tamil Nadu",
          "postalCode": "614625",
          "addressCountry": "IN"
        },
        "areaServed": [
          "AE", "SA", "VN", "CN", "TH", "MY", "BD", "US", "GB", "DE"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
