    <!--
      The hero image is the LCP candidate. Preloading it means it is fetched
      alongside the CSS rather than after the <picture> element parses. Gated on
      the same media query the <picture> uses, so phones — which get the plain
      navy gradient instead — never download it.
    -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/media/hero-2000.avif"
      imagesrcset="/media/hero-640.avif 640w, /media/hero-960.avif 960w, /media/hero-1280.avif 1280w, /media/hero-1600.avif 1600w, /media/hero-2000.avif 2000w"
      imagesizes="100vw"
      media="(min-width: 640px)"
      fetchpriority="high"
    />

    <!--
      Scroll reveals start hidden. That start state is applied here, not in the
      server-rendered markup, so the HTML this page ships is readable on its
      own — without JS, and for any crawler that does not run it.
      Reduced motion opts out entirely. The timeout is a failsafe: if the bundle
      never arrives, `hydrated` is never set and the start state is dropped
      rather than leaving the page invisible.
    -->
    <script>
      ;(function () {
        try {
          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return
          var el = document.documentElement
          el.classList.add('js-reveal')
          setTimeout(function () {
            if (!el.classList.contains('hydrated')) el.classList.remove('js-reveal')
          }, 4000)
        } catch (e) {}
      })()
    </script>
